# ── Media Renamer 部署（MoviePilot 式）──
# 启动后访问 http://localhost:3000 首次启动会引导创建管理员
#
# 卷说明：
#   ./config   持久化存储（SQLite 数据库 + config.json 配置文件）
#   /media     影视文件根目录，按需修改为实际媒体文件挂载点
#
# 权限说明（同 MoviePilot）：
#   PUID/PGID 设为宿主机用户 uid/gid（Linux: id -u / id -g；群晖默认 1026:100）
#   容器将以该权限运行，避免挂载卷文件权限问题；不设置则以 root 运行。
#
# 镜像源说明：
#   默认使用公共加速源 docker.1panel.live（2026-08 实测可用），
#   若你的环境可直连 Docker Hub，删除下方 NODE_IMAGE 即可使用官方源。
#   验证命令：curl -I https://docker.1panel.live/v2/library/node/manifests/20-slim

services:
  media-renamer:
    image: media-renamer:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: docker.1panel.live/library/node:20-slim
    container_name: media-renamer
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - TZ=Asia/Shanghai
      - PUID=0          # 宿主机用户 uid（Linux: id -u；群晖默认 1026）
      - PGID=0          # 宿主机用户 gid（Linux: id -g；群晖默认 100）
      - CONFIG_DIR=/config
      - JWT_SECRET=change-me-to-a-long-random-string-in-production
    volumes:
      - ./config:/config
      # 媒体目录挂载示例：按需修改或删除
      # - /path/to/your/movies:/media/movies:ro
      # - /path/to/your/tv:/media/tv:ro
    # 健康检查已内置镜像（HEALTHCHECK），如需自定义可在此覆盖
    # healthcheck:
    #   test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
