# ═══════════════════════════════════════════════════════════════
# Media Renamer 部署（Docker Compose）
# 镜像：GHCR 多架构（linux/amd64 · arm64 · arm/v7），一键拉取即用
#
# 快速开始：
#   docker compose up -d          # 拉取镜像并启动
#   docker compose pull && docker compose up -d   # 更新到最新版
#
# 权限（同 MoviePilot）：
#   PUID/PGID 设为宿主机用户 uid/gid，避免挂载卷权限问题
#     · Linux 查询：id -u / id -g
#     · 群晖默认：1026:100
#   不设置（0:0）则以 root 运行，开箱即用
#
# 卷：
#   ./config      持久化存储（SQLite 数据库 + config.json）
#   媒体目录      按需取消注释并修改挂载（重命名需要写权限，勿加 :ro）
# ═══════════════════════════════════════════════════════════════

services:
  media-renamer:
    image: ghcr.io/gaoab1/media-renamer:latest
    container_name: media-renamer
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - TZ=Asia/Shanghai
      - PUID=0                # 宿主机用户 uid（Linux: id -u；群晖默认 1026）
      - PGID=0                # 宿主机用户 gid（Linux: id -g；群晖默认 100）
      - JWT_SECRET=change-me-to-a-long-random-string-in-production
    volumes:
      - ./config:/config
      # 媒体目录挂载示例（重命名需要写权限，请勿加 :ro）：
      # - /path/to/your/movies:/media/movies
      # - /path/to/your/tv:/media/tv

# ── 本地构建模式（开发 / 自建镜像源）──
# 如需从源码构建而非拉取 GHCR 镜像，取消下方注释并移除上方 image 行：
