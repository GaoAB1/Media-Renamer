# ═══════════════════════════════════════════════════════════════
# Media Renamer — Docker 镜像自动构建发布（MoviePilot 式）
# 触发：
#   · push 到 master → 构建 latest + 推送 Docker Hub / GHCR
#   · 打 v* 标签（如 v1.0.0）→ 构建对应版本 tag
#   · 手动 workflow_dispatch 也可触发
# 需要配置仓库 Secrets：
#   DOCKER_USERNAME / DOCKER_PASSWORD（Docker Hub 账号）
#   GHCR 使用 GITHUB_TOKEN 自动注入，无需额外配置
# ═══════════════════════════════════════════════════════════════
name: buildx

on:
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  buildx:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 QEMU（多架构模拟）
        uses: docker/setup-qemu-action@v3

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKER_USERNAME }}/media-renamer
            ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch,suffix=-dev
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: 构建并推送（多架构）
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
